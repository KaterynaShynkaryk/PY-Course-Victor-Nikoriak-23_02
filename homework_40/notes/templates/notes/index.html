<!DOCTYPE html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої нотатки</title>
    <link rel="stylesheet" href="{% static 'notes/styles.css' %}">
</head>
<body>
    <main class="container">
        <h1>Мої нотатки</h1>
        <p class="subtitle">Дані з бази даних</p>

        <section class="notes-grid">
            {% for note in notes %}
                <article class="note-card">
                    <h2>{{ note.title }}</h2>
                    <p>{{ note.text }}</p>
                    <p><strong>Нагадування:</strong> {{ note.reminder }}</p>
                    <p><strong>Категорія:</strong> {{ note.category.title }}</p>
                </article>
            {% empty %}
                <p>Нотаток поки що немає.</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
